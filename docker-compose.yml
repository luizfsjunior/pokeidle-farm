services:
  worker:
    build: ./worker
    # on-failure: reinicia só se o worker quebrar. Contas em estado terminal
    # (needs_login/rejected) ficam paradas, sem reconectar contra um bloqueio;
    # o worker continua no ar esperando comandos do painel (ex.: Reconectar
    # depois de um token novo).
    restart: on-failure:5
    env_file: .env
    volumes:
      - worker-data:/app/data
    # Para o lease e a recuperação de comandos ficarem estáveis entre reinícios,
    # defina WORKER_HOLDER no .env (ex.: pc-casa). Sem isso, o nome é o hostname
    # do container, que muda.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  worker-data:
