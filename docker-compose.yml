services:
  worker:
    build: ./worker
    # on-failure: reinicia só se o worker quebrar. Quando todas as contas terminam
    # em estado terminal (needs_login/rejected), o worker sai com código 0 e o
    # container NÃO volta, para não ficar reconectando contra um bloqueio.
    restart: on-failure:5
    env_file: .env
    volumes:
      - worker-data:/app/data
    # Para o lease ficar estável entre reinícios, defina WORKER_HOLDER no .env
    # (ex.: droplet-1). Sem isso, o nome é o hostname do container, que muda.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  worker-data:
