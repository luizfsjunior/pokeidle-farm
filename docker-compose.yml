services:
  worker:
    build: ./worker
    # unless-stopped: volta sozinho depois de o Docker ou o WSL reiniciar (com
    # on-failure, uma saída limpa nessas horas deixava o worker parado) e também
    # se o processo quebrar. Só fica parado com `docker compose stop`/`down`.
    # Contas em estado terminal (needs_login/rejected) não derrubam o processo:
    # ficam paradas, sem reconectar contra um bloqueio, e o worker continua no ar
    # esperando comandos do painel (ex.: Reconectar depois de um token novo).
    restart: unless-stopped
    env_file: .env
    volumes:
      - worker-data:/app/data
    # Para o lease e a recuperação de comandos ficarem estáveis entre reinícios,
    # defina WORKER_HOLDER no .env (ex.: pc-casa). Sem isso, o nome é o hostname
    # do container, que muda.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  worker-data:
